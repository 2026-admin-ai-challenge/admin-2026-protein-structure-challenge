# Front door for the site. /api goes straight to the API so that large ZIP uploads are
# streamed instead of being buffered by the Next.js server (whose proxy stops at 10 MB).
server {
    listen 80;
    server_tokens off;

    # Docker's DNS, re-resolved so a restarted api/web container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    set $web http://web:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";

    # Ordinary API requests are small JSON bodies.
    client_max_body_size 64k;

    # Model ZIP upload: no proxy-side size limit and no buffering. The API enforces the
    # exact limit (MAX_ZIP_BYTES) from Content-Length and again while reading the stream.
    location = /api/submissions {
        client_max_body_size 0;
        proxy_request_buffering off;
        client_body_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_pass $api;
    }

    # Dataset downloads can be large: stream them and keep Range requests working.
    location /api/ {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass $api;
    }

    location / {
        proxy_pass $web;
    }
}

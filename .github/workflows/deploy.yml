name: Deploy
# Builds the three images here and tells the server to pull them. The server has one
# OCPU, where building the web image takes about half an hour; pulling takes a minute.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            target: api
          - name: worker
            dockerfile: apps/api/Dockerfile
            target: worker
          - name: web
            dockerfile: apps/web/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send the new images to the server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_opts="-i $HOME/.ssh/deploy_key -o BatchMode=yes"
          host="ubuntu@$DEPLOY_HOST"
          root=admin-2026-protein-structure-challenge

          # This job's own token can read the images it just pushed, and it expires with
          # the job. Sent on stdin so it never appears in a command line.
          printf '%s' "$REGISTRY_TOKEN" |
            ssh $ssh_opts "$host" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"

          # Config the server reads from disk rather than from an image.
          scp $ssh_opts docker-compose.yml docker-compose.ghcr.yml docker-compose.remote.yml "$host:~/$root/"
          scp $ssh_opts deploy/nginx.conf "$host:~/$root/deploy/"

          ssh $ssh_opts "$host" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/admin-2026-protein-structure-challenge
          compose="docker compose -f docker-compose.yml -f docker-compose.ghcr.yml"
          # Remote GPU scoring once the server's .env names the GPU machine; mock until then,
          # so a deploy never stops on remote settings nobody has written yet. A half-written
          # set stops `pull` below with the name of the missing value, before anything restarts.
          if grep -Eq '^EVAL_SSH_HOST=[^[:space:]]' .env 2>/dev/null; then
            # The key files are checked here so a typo stops the deploy before anything restarts.
            for name in EVAL_SSH_KEY_FILE EVAL_SSH_KNOWN_HOSTS_FILE; do
              # As compose reads .env: a ` # comment` after the value and quotes are not part of it.
              # `|| true`: a missing line must reach the message below, not stop on grep's exit status.
              file=$( (grep -E "^$name=" .env || true) | tail -n 1 | cut -d= -f2- \
                | sed -e 's/[[:space:]]#.*$//' -e 's/[[:space:]]*$//' | tr -d "\"'")
              if [ -z "$file" ] || [ ! -f "$file" ]; then
                echo "remote scoring: $name in .env must name an existing file (now: '$file')" >&2
                exit 1
              fi
            done
            compose="$compose -f docker-compose.remote.yml"
            echo "scoring: remote GPU (docker-compose.remote.yml)"
          else
            echo "scoring: mock (EVAL_SSH_HOST is not set in .env)"
          fi
          $compose pull
          $compose up -d
          # One OCPU and 50 GB: old layers add up fast.
          docker image prune -f
          # The token dies with this job; leaving it would only confuse a later pull.
          docker logout ghcr.io
          $compose ps
          REMOTE

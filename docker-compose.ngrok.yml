# Public HTTPS address through ngrok. Add this file on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.ngrok.yml up --build -d
#
# Requires in .env:
#   NGROK_AUTHTOKEN   from https://dashboard.ngrok.com/get-started/your-authtoken
#   NGROK_DOMAIN      your account's dev domain, e.g. something.ngrok-free.dev (no https://,
#                     and not the ID that starts with rd_)
#   SECRET_KEY        a new random value; the API refuses the public development default
#
# While this is running, use the ngrok address only. Logging in at http://localhost:3000
# is rejected because the API now accepts requests from the ngrok origin alone.
services:
  api:
    environment:
      APP_ORIGIN: https://${NGROK_DOMAIN:?set NGROK_DOMAIN in .env to your ngrok dev domain}
      COOKIE_SECURE: "true"
  gateway:
    networks: [default, tunnel_net]
  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "http://gateway:80", "--url", "https://${NGROK_DOMAIN}", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}
    depends_on:
      gateway:
        condition: service_started
    # Reaches the gateway only: the database, API and worker are not on this network.
    networks: [tunnel_net]
    restart: unless-stopped
networks:
  tunnel_net:

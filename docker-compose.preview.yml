# Optional temporary HTTPS sharing. Start only after securing .env and verifying the dataset gate.
services:
  web:
    networks: [default, preview_net]
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://web:3000"]
    depends_on:
      web:
        condition: service_started
    networks: [preview_net]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
networks:
  preview_net:

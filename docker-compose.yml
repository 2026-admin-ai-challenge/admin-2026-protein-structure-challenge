x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://admin:${POSTGRES_PASSWORD:-local-challenge-only}@postgres:5432/challenge
  SECRET_KEY: ${SECRET_KEY:-local-development-only-change-this-64-character-secret-before-deploy}
  DATA_DIR: /srv/data
  SUBMISSION_DIR: /srv/submissions
  # mock = fake scores for development. Real scoring: add docker-compose.evaluator.yml.
  EVALUATOR: mock
  MAX_ZIP_BYTES: ${MAX_ZIP_BYTES:-524288000}
  MAX_UNZIPPED_BYTES: ${MAX_UNZIPPED_BYTES:-2147483648}
  MAX_ZIP_ENTRIES: ${MAX_ZIP_ENTRIES:-2000}
  ZIP_REQUIRED: ${ZIP_REQUIRED:-inference.py,train.py,requirements.txt,model/}
  INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-600}
  TEAM_SUBMISSION_LIMIT: ${TEAM_SUBMISSION_LIMIT:-10}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: challenge
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-challenge-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d challenge"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    environment:
      <<: *backend-env
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # Only participant files. Hidden labels are never mounted into the web-facing API.
      - ${DATA_HOST_DIR:-../admin-2026-protein-data/data}/public:/srv/data/public:ro
      - submissions:/srv/submissions
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 10
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    environment:
      <<: *backend-env
      MOCK_DELAY_SECONDS: ${MOCK_DELAY_SECONDS:-5}
      WORKER_STALE_SECONDS: ${WORKER_STALE_SECONDS:-120}
    volumes:
      - submissions:/srv/submissions:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  # Single entry point. Pages go to web, /api goes straight to api so large ZIP uploads
  # are streamed (the Next.js proxy stops at 10 MB).
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
volumes:
  postgres_data:
  submissions:
